<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>jason999.bbroot.com</title>
<meta name="description" content="jason999.bbroot.com — 零成本托管的静态站点">
<link rel="canonical" href="https://jason999.bbroot.com/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127968;</text></svg>">
<style>
  :root{
    --bg:#ffffff; --fg:#1a1a1a; --muted:#666;
    --line:#e5e5e5; --card:#fafafa; --accent:#2563eb;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#111; --fg:#e8e8e8; --muted:#999;
      --line:#2a2a2a; --card:#181818; --accent:#60a5fa;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    line-height:1.7; min-height:100vh;
    display:flex; flex-direction:column;
  }
  main{width:100%;max-width:760px;margin:0 auto;padding:64px 24px;flex:1}
  h1{font-size:2rem;margin-bottom:8px;letter-spacing:-.02em}
  .sub{color:var(--muted);margin-bottom:40px}
  section{margin-bottom:40px}
  h2{font-size:1.1rem;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .card{
    background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:16px 20px;margin-bottom:12px;
  }
  .card h3{margin:0 0 6px;font-size:1rem}
  .card p{margin:0;color:var(--muted);font-size:.9rem}
  code{
    background:var(--card);border:1px solid var(--line);
    padding:1px 6px;border-radius:4px;font-size:.85em;
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  }
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .ok{color:#16a34a;font-weight:600}
  footer{
    border-top:1px solid var(--line);padding:24px;
    text-align:center;color:var(--muted);font-size:.85rem;
  }
  @media (prefers-color-scheme: dark){ .ok{color:#4ade80} }
</style>
</head>
<body>
<main>
  <h1>jason999.bbroot.com</h1>
  <p class="sub">站点已上线 — 零服务器成本</p>

  <section>
    <h2>运行状态</h2>
    <div class="card">
      <h3><span class="ok">● 正常</span></h3>
      <p>静态托管于 Netlify，本机无需开机。</p>
    </div>
  </section>

  <section>
    <h2>技术构成</h2>
    <div class="card">
      <h3>前端</h3>
      <p>纯 HTML + CSS，无框架、无构建依赖。</p>
    </div>
    <div class="card">
      <h3>托管</h3>
      <p>Netlify 免费额度：100GB/月带宽 + 自动 HTTPS。</p>
    </div>
    <div class="card">
      <h3>域名</h3>
      <p>CNAME 指向 <code>*.netlify.app</code>，DNS 仍由 DNSHE 托管，未迁移 NS。</p>
    </div>
  </section>

  <section>
    <h2>联系方式</h2>
    <div class="card">
      <p>在此替换为你的实际内容。</p>
    </div>
  </section>
</main>

<footer>jason999.bbroot.com</footer>
</body>
</html>
